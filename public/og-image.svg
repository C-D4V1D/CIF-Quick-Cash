<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f3d1a"/>
      <stop offset="100%" stop-color="#1a5f2a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e6b32"/>
      <stop offset="100%" stop-color="#144d24"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1100" cy="80" r="220" fill="#ffffff" fill-opacity="0.04"/>
  <circle cx="80" cy="560" r="180" fill="#ffffff" fill-opacity="0.04"/>
  <circle cx="1050" cy="520" r="130" fill="#4ade80" fill-opacity="0.06"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="6" fill="#4ade80"/>

  <!-- Card -->
  <rect x="80" y="90" width="1040" height="450" rx="24" fill="url(#card)" opacity="0.55"/>

  <!-- Money bag icon area -->
  <circle cx="170" cy="190" r="52" fill="#4ade80" fill-opacity="0.15"/>
  <text x="170" y="208" text-anchor="middle" font-size="56">💰</text>

  <!-- Brand name -->
  <text x="80" y="310" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1">Christ-in-Fabian</text>
  <text x="80" y="385" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="64" font-weight="800" fill="#4ade80" letter-spacing="-1">Quick Cash</text>

  <!-- Tagline -->
  <text x="80" y="450" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#a7f3d0" letter-spacing="0.2">Need money fast? Bring your item and walk away with cash.</text>

  <!-- Location pill -->
  <rect x="80" y="490" width="312" height="42" rx="21" fill="#ffffff" fill-opacity="0.12"/>
  <text x="96" y="517" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="22" fill="#d1fae5">📍 Enugwu-Aguleri, Anambra</text>

  <!-- Service pills -->
  <rect x="414" y="490" width="200" height="42" rx="21" fill="#4ade80" fill-opacity="0.18"/>
  <text x="514" y="517" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#4ade80">Cash Advance</text>

  <rect x="628" y="490" width="196" height="42" rx="21" fill="#fbbf24" fill-opacity="0.18"/>
  <text x="726" y="517" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#fbbf24">Outright Sale</text>

  <!-- Bottom domain bar -->
  <rect x="0" y="588" width="1200" height="42" fill="#000000" fill-opacity="0.3"/>
  <text x="600" y="615" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="20" fill="#6ee7b7" letter-spacing="0.5">cifcash.netlify.app</text>
</svg>
