name = "cifcash"
pages_build_output_dir = "dist"

# ── Bindings are managed in the Cloudflare Dashboard ─────────────────────────
# Pages → cifcash → Settings → Functions → Bindings
#
# Required bindings:
#   D1 database  →  variable name: DB       (your existing database)
#   R2 bucket    →  variable name: PHOTOS   (bucket: cifcash-photos)
#
# Do NOT add [[d1_databases]] or [[r2_buckets]] sections here — doing so
# requires a valid database_id and will override your dashboard settings.
